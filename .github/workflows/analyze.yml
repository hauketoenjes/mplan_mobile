name: Analyze code

on:
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          # Same as .fvmrc. Latest stable warns about the custom_lint plugin
          # entry, and flutter analyze fails on warnings.
          flutter-version: "3.35.7"
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze code
        run: flutter analyze
